[package]
name = "wsm-os-kernel"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "wsm-os-kernel"
path = "src/main.rs"
test = false
bench = false

[dependencies]
bootloader_api = "=0.11.17"
x86_64 = { version = "0.15", default-features = false, features = ["instructions"] }
wsm-os-runtime = { path = "../wsm-os-runtime" }
wsm-os-target = { path = "../wsm-os-target" }
