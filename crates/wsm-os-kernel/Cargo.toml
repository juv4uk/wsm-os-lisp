[package]
name = "wsm-os-kernel"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "wsm-os-kernel"
path = "src/main.rs"
test = false
bench = false

[dependencies]
bootloader = "0.9.23"
wsm-os-runtime = { path = "../wsm-os-runtime" }

[package.metadata.bootimage]
test-args = ["-device", "isa-debug-exit,iobase=0xf4,iosize=0x04", "-serial", "stdio", "-display", "none"]
test-success-exit-code = 33
test-timeout = 30
