name: Sync my-lisp language contract

on:
  schedule:
    - cron: "37 4 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync-my-lisp-contract.yml"
  pull_request:
    paths:
      - "contracts/my-lisp/**"

# Superseded runs on the same ref are cancelled: a queue of stale witness
# runs on main tells you nothing that the newest run does not.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
    uses: juv4uk/sens/.github/workflows/sync-language-contract.yml@main

  verify:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    uses: juv4uk/sens/.github/workflows/verify-language-contract.yml@main
