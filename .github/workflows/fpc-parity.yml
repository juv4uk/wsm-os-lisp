name: FPC embedded parity

on:
  push:
    paths:
      - "src/pascal_probe.pas"
      - "src/pascal_probe_oom.pas"
      - "scripts/check-fpc-embedded-parity.sh"
      - "scripts/probe-fpc-embedded.sh"
      - "artifacts/fixture.s"
      - "artifacts/nucleus-witness-alloc-oom-fixture.s"
      - "artifacts/qemu-serial-transcript.txt"
      - "artifacts/nucleus-witness-pascal-entry-qemu-serial-transcript.txt"
      - "artifacts/nucleus-witness-alloc-oom-fixture-qemu-serial-transcript.txt"
      - "scripts/build-uefi-image.sh"
      - "scripts/run-qemu-uefi.sh"
      - "docs/FPC-PARITY-P2.md"
      - "tests/fpc_embedded_kernel_probe.pas"
      - "tests/fpc_embedded_program_features.pas"
      - "tests/fpc_embedded_minimal_program.pas"
      - ".github/workflows/fpc-parity.yml"
  pull_request:
    paths:
      - "src/pascal_probe.pas"
      - "src/pascal_probe_oom.pas"
      - "scripts/check-fpc-embedded-parity.sh"
      - "scripts/probe-fpc-embedded.sh"
      - "artifacts/fixture.s"
      - "artifacts/nucleus-witness-alloc-oom-fixture.s"
      - "artifacts/qemu-serial-transcript.txt"
      - "artifacts/nucleus-witness-pascal-entry-qemu-serial-transcript.txt"
      - "artifacts/nucleus-witness-alloc-oom-fixture-qemu-serial-transcript.txt"
      - "scripts/build-uefi-image.sh"
      - "scripts/run-qemu-uefi.sh"
      - "docs/FPC-PARITY-P2.md"
      - "tests/fpc_embedded_kernel_probe.pas"
      - "tests/fpc_embedded_program_features.pas"
      - "tests/fpc_embedded_minimal_program.pas"
      - ".github/workflows/fpc-parity.yml"
  workflow_dispatch:

jobs:
  fpc-embedded-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install UEFI/QEMU image toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 ovmf mtools dosfstools gdisk binutils curl python3
      - name: Pin and verify FPC x86_64-embedded toolchain
        run: timeout 300s bash scripts/probe-fpc-embedded.sh
      - name: Compare ASM and Pascal value/OOM paths on embedded target
        run: WSM_P2_REPEATS=3 timeout 300s bash scripts/check-fpc-embedded-parity.sh
      - name: Upload embedded parity and cycle records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fpc-embedded-parity
          path: |
            target/fpc-embedded-probe/
            target/fpc-embedded-parity/
          if-no-files-found: error
