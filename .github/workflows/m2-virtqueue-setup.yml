name: M2 virtqueue setup

on:
  push:
    paths:
      - "src/runtime.s"
      - "src/entry.s"
      - "src/linker.ld"
      - "artifacts/m2-virtqueue-setup-probe.s"
      - "scripts/build-uefi-image.sh"
      - "scripts/run-qemu-uefi.sh"
      - "scripts/check-m2-virtqueue-setup.sh"
      - ".github/workflows/m2-virtqueue-setup.yml"
  pull_request:
    paths:
      - "src/runtime.s"
      - "src/entry.s"
      - "src/linker.ld"
      - "artifacts/m2-virtqueue-setup-probe.s"
      - "scripts/build-uefi-image.sh"
      - "scripts/run-qemu-uefi.sh"
      - "scripts/check-m2-virtqueue-setup.sh"
      - ".github/workflows/m2-virtqueue-setup.yml"
  workflow_dispatch:

jobs:
  queue0:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install pure target dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 ovmf mtools dosfstools gdisk binutils
      - name: Prove modern virtqueue0 setup
        run: bash scripts/check-m2-virtqueue-setup.sh
      - name: Upload queue0 witness
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m2-virtqueue-setup-witness
          path: target/m2-virtqueue-setup/
          if-no-files-found: error
