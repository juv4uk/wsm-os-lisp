name: Docs in change

# Definition of Done item 5: code and documentation belong to the same commit.
# The regression harness protects against range-level false positives.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-in-change:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test same-commit gate regressions
        run: bash scripts/test-docs-in-change.sh
      - name: Require documentation in each code commit
        env:
          BASE_SHA: ${{ github.event.before || github.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: bash scripts/check-docs-in-change.sh "$BASE_SHA" "$HEAD_SHA"
