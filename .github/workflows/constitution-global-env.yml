name: Constitution global environment

on:
  push:
    paths:
      - "src/runtime.s"
      - "src/entry.s"
      - "artifacts/nucleus-witness-global-*.s"
      - "artifacts/nucleus-witness-global-*-qemu-serial-transcript.txt"
      - "scripts/build-uefi-image.sh"
      - "scripts/run-qemu-uefi.sh"
      - "scripts/check-constitution-global-env.sh"
      - "docs/GLOBAL-ENV-DEFINITIONS.md"
      - ".github/workflows/constitution-global-env.yml"
  pull_request:
    paths:
      - "src/runtime.s"
      - "src/entry.s"
      - "artifacts/nucleus-witness-global-*.s"
      - "artifacts/nucleus-witness-global-*-qemu-serial-transcript.txt"
      - "scripts/build-uefi-image.sh"
      - "scripts/run-qemu-uefi.sh"
      - "scripts/check-constitution-global-env.sh"
      - "docs/GLOBAL-ENV-DEFINITIONS.md"
      - ".github/workflows/constitution-global-env.yml"
  workflow_dispatch:

# Superseded runs on the same ref are cancelled: a queue of stale witness
# runs on main tells you nothing that the newest run does not.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  global-env:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install pure target dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 ovmf mtools dosfstools gdisk binutils
      - name: Prove bounded global definitions, unbound and exhaustion laws
        run: bash scripts/check-constitution-global-env.sh
      - name: Upload global definition witnesses
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: constitution-global-env-witness
          path: target/constitution-global-env/
          if-no-files-found: error
