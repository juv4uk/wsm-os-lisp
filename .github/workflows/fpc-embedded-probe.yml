name: FPC x86_64 embedded target probe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/probe-fpc-embedded.sh"
      - "tests/fpc_embedded_probe.pas"
      - "tests/fpc_embedded_entry.s"
      - "tests/fpc_embedded_kernel_probe.pas"
      - "tests/fpc_embedded_efi_abi_stub.s"
      - "tests/fpc_embedded_program_features.pas"
      - "tests/fpc_embedded_minimal_program.pas"
      - "src/pascal_probe.pas"
      - "src/pascal_handoff.pas"
      - "src/wsm.bootinfo.pas"
      - "tests/fpc/test_wsm_bootinfo.lpr"
      - "scripts/check-fpc-kernel-skeleton.sh"
      - "scripts/check-pascal-handoff.sh"
      - "scripts/check-fpc-embedded-pascal-handoff.sh"
      - "src/rtl_min.s"
      - "docs/FPC-KERNEL-SKELETON.md"
      - "docs/FPC-BOOTINFO-PACKAGE.md"
      - "scripts/check-fpc-embedded-kernel-probe.sh"
      - "scripts/build-uefi-image.sh"
      - "scripts/run-qemu-uefi.sh"
      - "scripts/ovmf-env.sh"
      - "src/entry.s"
      - "src/runtime.s"
      - "src/bootloader-config.bin"
      - "artifacts/bootx64.efi"
      - "artifacts/qemu-serial-transcript.txt"
      - ".github/workflows/fpc-embedded-probe.yml"
      - "src/linker.ld"

permissions:
  contents: read

concurrency:
  group: fpc-embedded-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  embedded-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install inspection tools
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            binutils file curl qemu-system-x86 ovmf mtools dosfstools gdisk
      - name: Collect checksum-pinned FPC embedded compile/link and MS ABI evidence (runtime witness)
        run: timeout 300s bash scripts/probe-fpc-embedded.sh
      - name: Prove embedded Pascal unit in UEFI QEMU without RTL stubs
        run: timeout 300s bash scripts/check-fpc-embedded-kernel-probe.sh
      - name: Prove reusable BootInfo unit on embedded target (P1)
        run: timeout 300s bash scripts/check-fpc-embedded-pascal-handoff.sh
      - name: Upload embedded probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fpc-embedded-probe-${{ github.sha }}
          path: |
            target/fpc-embedded-probe/
            target/fpc-embedded-kernel-probe/
            target/fpc-embedded-pascal-handoff/
          if-no-files-found: warn
          retention-days: 30
