name: wsm-os contracts

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  target-abi:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add x86_64-unknown-none
      - name: Check formatting
        run: cargo fmt --check
      - name: Check no_std target library
        run: cargo check -p wsm-os-target --lib
      - name: Check runtime on the bare-metal target
        run: cargo check -p wsm-os-runtime --lib --target x86_64-unknown-none
      - name: Prove runtime core has no host imports
        run: scripts/check-runtime-symbols.sh
      - name: Install bootimage
        run: cargo install bootimage
      - name: Build bare-metal boot image
        run: cargo bootimage -p wsm-os-kernel --target x86_64-unknown-none
      - name: Run ABI and projection tests
        run: cargo test --workspace
