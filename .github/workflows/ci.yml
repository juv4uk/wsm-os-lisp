name: wsm-os-lisp contracts

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Check repository role authority
        run: bash scripts/check-role-authority.sh
      - name: Check semantic authority
        run: bash scripts/check-semantic-authority.sh
      - name: Verify zero-Rust boundary (ADR-004)
        run: bash scripts/check-no-rust.sh
      - name: Prove pure assembly runtime has no forbidden host imports
        run: bash scripts/check-runtime-symbols.sh
      - name: Prove target observer is bounded (issue #33)
        run: bash scripts/check-target-observer-bounded.sh
      - name: Verify CML fixture provenance
        run: bash scripts/check-cml-provenance.sh
      - name: Setup external CML compiler toolchain
        run: |
          git clone --depth 1 https://github.com/juv4uk/my-lisp.git /tmp/my-lisp
          git clone --depth 1 https://github.com/juv4uk/cml.git /tmp/cml
          cd /tmp/cml
          cargo build --release
          echo "CML_BIN=/tmp/cml/target/release/cml" >> $GITHUB_ENV
      - name: Verify deterministic definition capsule
        run: bash scripts/check-definition-capsule.sh
      - name: Prove target renders foreign symbol ids through generic path (issue #33)
        run: bash scripts/check-target-observer-behaviour.sh
      - name: Verify task ledger DAG consistency
        run: bash scripts/check-task-dag.sh
      - name: Install build and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 ovmf mtools dosfstools gdisk binutils
      - name: Build pure UEFI boot image
        run: |
          bash scripts/build-uefi-image.sh artifacts/fixture.o target/wsm-os-uefi.img
          test -s target/wsm-os-uefi.img
      - name: Prove bounded UEFI serial boot in QEMU
        run: bash scripts/rebuild-and-run-qemu.sh
      - name: Prove Lisp MMIO device operation on real virtio-blk (issue #40)
        run: bash scripts/check-mmio-device-op.sh
      - name: Prove MMIO mutations fail closed with structured device/ABI conditions (issue #40)
        run: bash scripts/check-mmio-mutation-fail-closed.sh
      - name: Prove Lisp device policy polls with a finite budget (issue #40)
        run: bash scripts/check-mmio-bounded-poll.sh
      - name: Prove device failure is distinguishable from Lisp semantic failure (issue #40)
        run: bash scripts/check-condition-distinguishability.sh

