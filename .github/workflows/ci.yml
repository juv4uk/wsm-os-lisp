name: wsm-os-lisp contracts

# This workflow is an intentional always-run: it has no paths filter, because
# two of its gates read documentation rather than code
# (check-role-authority.sh reads README.md, check-semantic-authority.sh reads
# docs/TARGET-ABI.md). A docs-only commit must still be able to fail here.
# Every other workflow in this directory narrows itself with a paths filter,
# so a docs-only push costs one job, not nineteen.
on:
  push:
  pull_request:
  workflow_dispatch:

# Superseded runs on the same ref are cancelled: a queue of stale witness
# runs on main tells you nothing that the newest run does not.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Verify pinned neutral target ABI v11 / SENS Contract 12.0 authority
        run: bash scripts/check-target-abi-authority.sh
      - name: Check repository role authority
        run: bash scripts/check-role-authority.sh
      - name: Check semantic authority
        run: bash scripts/check-semantic-authority.sh
      - name: Guard against data-to-command interpolation in repository scripts
        run: bash scripts/check-shell-safety.sh
      - name: Re-check every citable policy against its enforcement point and witness (ADR-005)
        run: python3 scripts/check-policy-enforcement.py
      - name: Verify the image builder still pins every known variance source
        run: bash scripts/check-build-variance.sh
      - name: Enforce the task format on every task that is not declared legacy
        run: python3 scripts/check-task-format.py
      - name: Keep the static gate suite inside its wall-clock ceiling
        run: bash scripts/check-gate-budget.sh
      - name: Verify open language policy and pinned Lazarus source
        run: bash scripts/check-language-policy.sh
      - name: Prove pure assembly runtime has no forbidden host imports
        run: bash scripts/check-runtime-symbols.sh
      - name: Guard finite UART poll and distinct transport-failure exit (#31)
        run: bash scripts/check-serial-transport-gate.sh
      - name: Prove target observer is bounded (issue #33)
        run: bash scripts/check-target-observer-bounded.sh
      - name: Verify CML fixture provenance
        run: bash scripts/check-cml-provenance.sh
      - name: Setup pinned CML compiler toolchain
        run: |
          CML_REV="$(sed -n 's/.*(cml-revision "\([0-9a-f]\{40\}\)").*/\1/p' contracts/cml.lock)"
          test -n "$CML_REV"
          git init /tmp/cml
          git -C /tmp/cml remote add origin https://github.com/juv4uk/cml.git
          git -C /tmp/cml fetch --depth 1 origin "$CML_REV"
          git -C /tmp/cml checkout --detach FETCH_HEAD
          git -C /tmp/cml submodule update --init --recursive
          test "$(git -C /tmp/cml rev-parse HEAD)" = "$CML_REV"
          cd /tmp/cml
          cargo build --release
          echo "CML_BIN=/tmp/cml/target/release/cml" >> $GITHUB_ENV
      - name: Verify deterministic definition capsule
        run: bash scripts/check-definition-capsule.sh
      - name: Install build and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 ovmf mtools dosfstools gdisk binutils
      - name: Prove target renders foreign symbol ids through generic path (issue #33)
        run: bash scripts/check-target-observer-behaviour.sh
      - name: Verify task ledger DAG consistency
        run: bash scripts/check-task-dag.sh
      - name: Build pure UEFI boot image
        run: |
          bash scripts/build-uefi-image.sh artifacts/fixture.o target/wsm-os-uefi.img
          test -s target/wsm-os-uefi.img
      - name: Prove bounded UEFI serial boot in QEMU
        run: bash scripts/rebuild-and-run-qemu.sh
      - name: Prove Lisp MMIO device operation on real virtio-blk (issue #40)
        run: bash scripts/check-mmio-device-op.sh
      - name: Prove MMIO mutations fail closed with structured device/ABI conditions (issue #40)
        run: bash scripts/check-mmio-mutation-fail-closed.sh
      - name: Prove Lisp device policy polls with a finite budget (issue #40)
        run: bash scripts/check-mmio-bounded-poll.sh
      - name: Prove device failure is distinguishable from Lisp semantic failure (issue #40)
        run: bash scripts/check-condition-distinguishability.sh

