name: wsm-os contracts

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  target-abi:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Check repository role authority
        run: bash scripts/check-role-authority.sh
      - name: Check semantic authority
        run: bash scripts/check-semantic-authority.sh
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install nightly-2026-07-27 --profile minimal \
            --component rustfmt,rust-src,llvm-tools-preview \
            --target x86_64-unknown-none
          rustc --version --verbose
      - name: Check formatting
        run: cargo fmt --check
      - name: Check target ABI consumer
        run: cargo check -p wsm-os-runtime --lib
      - name: Check runtime on the bare-metal target
        run: cargo check -p wsm-os-runtime --lib --target x86_64-unknown-none
      - name: Prove runtime core has no host imports
        run: scripts/check-runtime-symbols.sh
      - name: Build bare-metal kernel
        run: cargo build -p wsm-os-kernel --target x86_64-unknown-none
      - name: Create UEFI boot image
        run: |
          cargo run -p wsm-os-image -- \
            target/x86_64-unknown-none/debug/wsm-os-kernel \
            target/wsm-os-uefi.img
          test -s target/wsm-os-uefi.img
      - name: Install QEMU and OVMF
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qemu-system-x86 ovmf
      - name: Prove bounded UEFI serial boot
        env:
          OVMF_CODE: /usr/share/OVMF/OVMF_CODE_4M.fd
          OVMF_VARS: /usr/share/OVMF/OVMF_VARS_4M.fd
          WSM_OS_QEMU_TIMEOUT: 20
        run: scripts/run-qemu-uefi.sh target/wsm-os-uefi.img
      - name: Prove pinned my-lisp oracle parity on hosted and QEMU
        env:
          OVMF_CODE: /usr/share/OVMF/OVMF_CODE_4M.fd
          OVMF_VARS: /usr/share/OVMF/OVMF_VARS_4M.fd
          WSM_OS_QEMU_TIMEOUT: 20
        run: bash scripts/check-shared-oracle-corpus.sh
      - name: Bind shared oracle provenance through QEMU transcript
        env:
          OVMF_CODE: /usr/share/OVMF/OVMF_CODE_4M.fd
          OVMF_VARS: /usr/share/OVMF/OVMF_VARS_4M.fd
          WSM_OS_QEMU_TIMEOUT: 20
        run: bash scripts/check-shared-oracle-provenance.sh
      - name: Prove bounded UEFI image reproducibility
        run: bash scripts/check-uefi-image-reproducibility.sh
      - name: Verify CML fixture provenance
        run: scripts/check-cml-provenance.sh
      - name: Verify deterministic definition capsule
        run: scripts/check-definition-capsule.sh
      - name: Run ABI and projection tests
        run: cargo test --workspace
